plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.dsbot'
version = '0.1.0'

android {
  namespace 'app.dsbot.notifications'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "com.squareup.okio:okio:3.9.0"
}
