name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm --prefix bridge run test:prepare
      - run: npm run check
      - run: npm --prefix bridge run test:integration
      - run: git diff --exit-code -- companion/client.js
      - run: npm run audit
      - run: npm run pack:bridge
      - run: npm --prefix bridge run test:delivery -- ../artifacts/ds-bot-mobile-bridge-0.0.6.tgz
      - run: npm run audit
      - run: npm run pack:companion
      - run: npm --prefix companion run test:delivery -- ../artifacts/ds-bot-mobile-app-0.1.0.tgz
      - run: npm run audit
